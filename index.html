    <script>
      /* theme before first paint: the visitor's choice, else the system's (dark by default) */
      (function () {
        var d = document.documentElement;
        d.classList.add('js');
        /* if the app never starts (script blocked or failed), show everything without the reveal motion */
        setTimeout(function () {
          if (!window.__kalangoMounted) d.classList.remove('js');
        }, 4000);
        try {
          var t = localStorage.getItem('kalangoos-theme');
          if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
